spring.application.name=JavaTest

# API: uses the API_BASE_URL environment variable on Render, falls back to the hosted API locally
api.base-url=${API_BASE_URL:https://northwindnode.runasp.net/api}

# Render provides the port through PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB