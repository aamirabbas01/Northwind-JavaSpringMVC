<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">
<head>
    <title>Delete Employee</title>
</head>
<body>

<div layout:fragment="content">

    <div class="card">

        <div class="card-header bg-danger text-white">
            <h3 class="card-title">Delete Employee</h3>
        </div>

        <div class="card-body">

            <div class="alert alert-danger" th:if="${param.error}">
                The employee could not be deleted. They may have related records.
            </div>

            <h5 class="text-danger mb-3">Are you sure you want to delete this employee?</h5>

            <dl class="row">
                <dt class="col-sm-3">Full Name</dt>
                <dd class="col-sm-9" th:text="${employee.fullName}"></dd>

                <dt class="col-sm-3">Title</dt>
                <dd class="col-sm-9" th:text="${employee.title}"></dd>

                <dt class="col-sm-3">City</dt>
                <dd class="col-sm-9" th:text="${employee.city}"></dd>

                <dt class="col-sm-3">Country</dt>
                <dd class="col-sm-9" th:text="${employee.country}"></dd>

                <dt class="col-sm-3">Reports To</dt>
                <dd class="col-sm-9" th:text="${employee.reportsToName}"></dd>
            </dl>

            <form method="post"
                  th:action="@{/employees/delete/{id}(id=${employee.employeeId})}"
                  onsubmit="return confirm('This will permanently delete the employee. Continue?');"
                  class="d-flex gap-2">

                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>

                <a th:href="@{/employees}" class="btn btn-secondary">Back to List</a>
            </form>

        </div>
    </div>

</div>

</body>
</html>
